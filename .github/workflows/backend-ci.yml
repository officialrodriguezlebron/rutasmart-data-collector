name: RutaSmart Backend CI

# Runs the automated test suite on every push and pull request.
# This enforces the functional-correctness and reliability contracts before
# any change reaches the deployed system — the core of the maintainability and
# reliability characteristics in the ISO/IEC 25010 evaluation (SOP6).

on:
  push:
    branches: [ main ]
    paths:
      - 'rutasmart-backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'rutasmart-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rutasmart-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite with coverage
        env:
          # Placeholder — the test suite never connects to a real database.
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Fail if coverage on the analytics core drops below threshold
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          pytest --cov=app.analytics.algorithms --cov-fail-under=60 -q
