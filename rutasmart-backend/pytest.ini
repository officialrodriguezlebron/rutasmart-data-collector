[pytest]
# ── RutaSmart backend test configuration ─────────────────────────────────────
# Run with:   pytest
#   coverage: pytest --cov=app --cov-report=term-missing
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: pure-function unit tests (no DB, no network)
    contract: input/output contract tests (validation, edge cases)
    integration: tests that exercise multiple modules together
    regression: tests that lock in fixed bugs so they never return
